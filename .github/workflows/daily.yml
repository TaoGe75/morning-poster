name: daily-morning-poster

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间 07:00（GitHub 定时常有延迟，提前到 7 点保准点）
    - cron: "30 23 * * *"  # UTC 23:30 = 北京时间 07:30，兜底重试；当天已推过会自动跳过
  workflow_dispatch:
    inputs:
      push_wechat:
        description: "是否推送微信（false=仅生成测试）"
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-poster
  cancel-in-progress: false

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today already pushed
        id: guard
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(date -u -d '+8 hours' +%F)
          if git log --oneline -30 | grep -q "poster $TODAY"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天（$TODAY）已生成过海报，本次重试跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        run: pip install --disable-pip-version-check pillow lunar_python

      - name: Download font (霞鹜文楷)
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p cloud/fonts
          curl -sL --retry 3 --retry-delay 3 -o cloud/fonts/LXGWWenKai-Regular.ttf \
            "https://github.com/lxgw/LxgwWenKai/releases/download/v1.520/LXGWWenKai-Regular.ttf"
          curl -sL --retry 3 --retry-delay 3 -o cloud/fonts/LXGWWenKai-Medium.ttf \
            "https://github.com/lxgw/LxgwWenKai/releases/download/v1.520/LXGWWenKai-Medium.ttf"
          curl -sL --retry 3 --retry-delay 3 -o cloud/fonts/MaShanZheng-Regular.ttf \
            "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/mashanzheng/MaShanZheng-Regular.ttf"
          ls -lh cloud/fonts

      - name: Generate poster
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: python cloud/poster.py

      - name: Commit poster
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "morning-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posters/ cloud/_info.json
          git commit -m "poster $(date -u -d '+8 hours' +%F)" || echo "nothing to commit"
          git push

      - name: Push to WeChat (Server酱)
        if: ${{ (github.event_name != 'schedule' || steps.guard.outputs.skip != 'true') && inputs.push_wechat != 'false' }}
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python cloud/push_wechat.py
